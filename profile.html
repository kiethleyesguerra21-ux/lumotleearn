<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>


<nav class="navbar">

    <div class="logo">
        STUDENT PORTAL
    </div>

    <div class="nav-right">

        <a href="{{ url_for('dashboard') }}">
            Dashboard
        </a>

        <span>|</span>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>

    </div>

</nav>


<main class="page-container">

    <a href="{{ url_for('dashboard') }}"
       class="back-link">
        ← Back to Dashboard
    </a>


    <div class="profile-page">

        <div class="profile-avatar">
            {{ user["username"][0].upper() }}
        </div>

        <h1>
            {{ user["username"] }}
        </h1>

        <p>
            Student
        </p>


        <div class="profile-information">


            <div class="profile-row">

                <span>
                    User ID
                </span>

                <strong>
                    {{ user["user_id"] }}
                </strong>

            </div>


            <div class="profile-row">

                <span>
                    Username
                </span>

                <strong>
                    {{ user["username"] }}
                </strong>

            </div>


            <div class="profile-row">

                <span>
                    Course
                </span>

                <strong>
                    {{ user["course"] or "Information Technology" }}
                </strong>

            </div>


            <div class="profile-row">

                <span>
                    Year Level
                </span>

                <strong>
                    {{ user["year_level"] or "1st Year" }}
                </strong>

            </div>


        </div>

    </div>

</main>


</body>

</html>
