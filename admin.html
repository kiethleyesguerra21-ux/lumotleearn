<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Panel</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="admin-container">

        <div class="admin-header">

            <div>
                <h1>Admin Panel</h1>
                <p>Create and manage users.</p>
            </div>

            <a href="{{ url_for('admin_logout') }}"
               class="logout-btn">
                Logout
            </a>

        </div>


        <!-- CREATE USER -->

        <div class="card">

            <h2>Create New User</h2>

            <form
                action="{{ url_for('create_user') }}"
                method="POST"
                class="user-form"
            >

                <div>
                    <label for="user_id">
                        User ID
                    </label>

                    <input
                        type="text"
                        id="user_id"
                        name="user_id"
                        placeholder="Example: 1001"
                        required
                    >
                </div>

                <div>
                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Example: Kiethley"
                        required
                    >
                </div>

                <button type="submit">
                    Create User
                </button>

            </form>

        </div>


        <!-- USERS -->

        <div class="card">

            <h2>Registered Users</h2>

            {% if users %}

            <table>

                <thead>
                    <tr>
                        <th>#</th>
                        <th>User ID</th>
                        <th>Username</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody>

                    {% for user in users %}

                    <tr>

                        <td>
                            {{ loop.index }}
                        </td>

                        <td>
                            {{ user["user_id"] }}
                        </td>

                        <td>
                            {{ user["username"] }}
                        </td>

                        <td>

                            <a
                                href="{{ url_for('delete_user', user_id=user['id']) }}"
                                class="delete-btn"
                                onclick="return confirm('Delete this user?')"
                            >
                                Delete
                            </a>

                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

            {% else %}

            <p class="no-users">
                No users have been created yet.
            </p>

            {% endif %}

        </div>

    </div>

</body>

</html>
